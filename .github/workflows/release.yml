name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Allows building the APK (and attaching it to an existing release via `gh`)
  # without cutting a new tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            android-app/android/gradle/wrapper/gradle-wrapper.properties
            android-app/android/build.gradle
            android-app/android/app/build.gradle
            android-app/android/settings.gradle

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: android-app/package-lock.json

      - name: Install JS dependencies
        working-directory: ./android-app
        run: npm ci

      - name: Build debug APK
        working-directory: ./android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build release notes
        id: notes
        run: |
          {
            echo "body<<NOTE_EOF"
            echo "## Installation"
            echo
            echo '```bash'
            echo "# Install dependencies"
            echo "pip install -r requirements.txt"
            echo
            echo "# For frontend"
            echo "cd frontend && npm install"
            echo
            echo "# For Android app"
            echo "cd android-app && npm install"
            echo '```'
            echo
            echo "## Docker"
            echo
            echo '```bash'
            echo "docker compose up -d"
            echo '```'
            echo
            echo "The Android debug APK is attached below."
            echo "NOTE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download APK
        uses: actions/download-artifact@v6
        with:
          name: release-apk
          path: release-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.VERSION }}
          name: Release ${{ steps.tag_version.outputs.VERSION }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          files: release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
