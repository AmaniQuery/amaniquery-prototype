name: Android CI

on:
  push:
    branches: [master, develop]
    paths:
      - 'android-app/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'android-app/**'
      - '.github/workflows/ci-android.yml'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            android-app/android/gradle/wrapper/gradle-wrapper.properties
            android-app/android/build.gradle
            android-app/android/app/build.gradle
            android-app/android/settings.gradle

      # settings.gradle and app/build.gradle shell out to `node` at configuration
      # time (react-native / expo autolinking), so npm deps must be installed first.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: android-app/package-lock.json

      - name: Install JS dependencies
        working-directory: ./android-app
        run: npm ci

      - name: Build Android app
        working-directory: ./android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: amaniquery-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
