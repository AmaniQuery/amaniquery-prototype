name: Android CI

on:
  push:
    branches: [master, develop]
    paths:
      - 'android-app/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'android-app/**'
      - '.github/workflows/ci-android.yml'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: android-app/android/build.gradle

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android-app/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-app/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android app
        working-directory: ./android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
